name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test.py
      - run: python3 scripts/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: floating-todo-macos
          path: |
            dist/*.zip
            dist/*.sha256
